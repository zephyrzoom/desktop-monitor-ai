<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <!--
    应用图标母版：与侧边栏品牌标识同源（渐变圆角方块 + 白色活动曲线）。
    按 macOS 图标规范留白：1024 画布内 824×824 主体、圆角 185。
    由 tauri icon 生成各平台尺寸，勿直接改动生成结果。
  -->
  <defs>
    <linearGradient id="bg" x1="180" y1="140" x2="860" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5570FF" />
      <stop offset="0.55" stop-color="#6C5CF5" />
      <stop offset="1" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="sheen" x1="512" y1="100" x2="512" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" />
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)" />
  <rect
    x="101"
    y="101"
    width="822"
    height="822"
    rx="184"
    stroke="#FFFFFF"
    stroke-opacity="0.16"
    stroke-width="2"
  />

  <!-- 活动曲线：与界面 Icon 的 activity 图形同款，加粗后在小尺寸下仍清晰 -->
  <path
    d="M22 12h-4l-3 9L9 3l-3 9H2"
    transform="translate(260 260) scale(21)"
    stroke="#FFFFFF"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
