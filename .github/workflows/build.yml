name: Build

on:
  push:
    # tauri 为 Electron → Tauri 迁移分支，合并进主干后可移除
    branches: [main, master, tauri]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Tauri bundle
        run: npx tauri build --bundles nsis

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "src-tauri\target\release\desktop-monitor.exe" "dist\desktop-monitor-portable.exe"
          Copy-Item "src-tauri\target\release\bundle\nsis\*.exe" "dist\"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/*.exe
          if-no-files-found: error

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Tauri(webkit2gtk) + 截图(xcap：pipewire / libwayshot) + TLS(openssl) 的构建依赖
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            clang \
            libclang-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libwayland-dev \
            libdrm-dev \
            libgbm-dev \
            libegl-dev \
            libxkbcommon-dev \
            libxcb1-dev \
            libxcb-randr0-dev \
            libxcb-shm0-dev \
            libxcb-util-dev

      - name: Install dependencies
        run: npm ci

      - name: Build deb
        run: |
          set -o pipefail
          if npx tauri build --bundles deb 2>&1 | tee build.log; then
            exit 0
          fi
          # 构建失败时把关键错误行输出为 annotation，便于在 Actions 页面/API 直接看到
          {
            grep -n -m 5 -E "error\[E[0-9]+\]|^error:|Error:|No package|cannot find|not found|Package .* not found" build.log || true
            echo '--- tail ---'
            tail -n 12 build.log
          } | while IFS= read -r line; do
            [ -z "$line" ] && continue
            echo "::error title=linux-build::$(printf '%s' "$line" | cut -c1-400)"
          done
          exit 1

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp src-tauri/target/release/bundle/deb/*.deb dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-build
          path: |
            dist/*.deb
          if-no-files-found: error

  # 每次 main/master 构建（含手动触发）都把产物发布到固定的 nightly Release，可直接下载
  release-nightly:
    needs: [build-windows, build-linux-arm64]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist

      - name: Download Linux arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64-build
          path: dist

      - name: Publish to nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build (${{ github.ref_name }})
          body: |
            最新构建（未发版，可能不稳定）
            - 框架：Tauri 2
            - 分支：${{ github.ref_name }}
            - 提交：${{ github.sha }}
            - Windows 便携版需要系统自带 WebView2 运行时（Win10 1803+ 默认内置）
          prerelease: true
          make_latest: false
          files: |
            dist/*.exe
            dist/*.deb
          fail_on_unmatched_files: true

  release:
    needs: [build-windows, build-linux-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist

      - name: Download Linux arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64-build
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.deb
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
