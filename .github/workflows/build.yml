name: Build

on:
  push:
    # tauri 为 Electron → Tauri 迁移分支，new-ui 为界面改版分支，合并进主干后可移除
    branches: [main, master, tauri, new-ui]
    tags: ['v*']
  pull_request:
    # PR 的 base 分支在这里匹配，tauri/new-ui 互提 PR 也能跑构建
    branches: [main, master, tauri, new-ui]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Tauri bundle
        # 只出便携版（裸 exe），不打 NSIS 安装包
        run: npx tauri build --no-bundle

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "src-tauri\target\release\desktop-monitor.exe" "dist\desktop-monitor-portable.exe"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/*.exe
          if-no-files-found: error

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Tauri(webkit2gtk) + 截图(xcap：pipewire / libwayshot) + TLS(openssl) 的构建依赖
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            clang \
            libclang-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libwayland-dev \
            libdrm-dev \
            libgbm-dev \
            libegl-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxext-dev \
            libxss-dev \
            libxcb1-dev \
            libxcb-randr0-dev \
            libxcb-shm0-dev \
            libxcb-util-dev

      - name: Install dependencies
        run: npm ci

      - name: Build deb
        run: |
          set -o pipefail
          if npx tauri build --bundles deb 2>&1 | tee build.log; then
            exit 0
          fi
          # 构建失败时把关键错误行输出为 annotation，便于在 Actions 页面/API 直接看到
          {
            grep -n -m 5 -E "error\[E[0-9]+\]|^error:|Error:|No package|cannot find|not found|Package .* not found" build.log || true
            echo '--- tail ---'
            tail -n 12 build.log
          } | while IFS= read -r line; do
            [ -z "$line" ] && continue
            echo "::error title=linux-build::$(printf '%s' "$line" | cut -c1-400)"
          done
          exit 1

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp src-tauri/target/release/bundle/deb/*.deb dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-build
          path: |
            dist/*.deb
          if-no-files-found: error

  # 每次成功的构建（分支 push / PR / 手动触发）都把产物发布到 Release。
  # tag 按分支或 PR 固定，同名安装包被最新一次构建覆盖，下载链接长期不变。
  # 推送 v* tag 时不走这里，由下面的 release 任务发正式版。
  # fork PR 的 GITHUB_TOKEN 只有读权限、无法创建 tag，跳过发布（artifacts 仍照常上传）。
  release-continuous:
    needs: [build-windows, build-linux-arm64]
    if: >-
      !startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # 同一分支/PR 的多次构建串行发布，避免并发运行互相覆盖同一批 assets
    concurrency:
      group: release-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist

      - name: Download Linux arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64-build
          path: dist

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            label="PR #${{ github.event.pull_request.number }}"
            slug="pr-${{ github.event.pull_request.number }}"
          else
            label="${GITHUB_REF_NAME}"
            slug=$(printf '%s' "$label" | tr -c 'A-Za-z0-9._-' '-')
          fi
          {
            echo "label=$label"
            echo "tag=continuous-$slug"
            echo "built_at=$(date -u '+%Y-%m-%d %H:%M UTC')"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to continuous release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Auto Build (${{ steps.meta.outputs.label }})
          body: |
            每次构建自动生成，同名安装包会被最新一次构建覆盖（未发版，可能不稳定）。
            - 框架：Tauri 2
            - 来源：${{ steps.meta.outputs.label }}
            - 提交：${{ github.event.pull_request.head.sha || github.sha }}
            - 构建时间：${{ steps.meta.outputs.built_at }}
            - 运行记录：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Windows 便携版需要系统自带 WebView2 运行时（Win10 1803+ 默认内置）
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: |
            dist/*.exe
            dist/*.deb
          fail_on_unmatched_files: true

  release:
    needs: [build-windows, build-linux-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist

      - name: Download Linux arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64-build
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.deb
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
